services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hbys-app
    container_name: hbys-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      - mysql
      - redis

  web:
    image: nginx:alpine
    container_name: hbys-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: hbys-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hbys_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: hbys-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  dbdata:
  vendor_data: